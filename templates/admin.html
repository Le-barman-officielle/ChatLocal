<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Panneau admin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="admin-body-page">
  <div class="admin-app">
    <header class="admin-header">
      <h1>🛠️ Panneau admin</h1>
      <a href="{{ url_for('chat') }}">← Retour au chat</a>
    </header>

    <div class="admin-columns">
      <aside class="admin-col">
        <h2>Membres</h2>
        <ul id="admin-users-list" class="list"></ul>
      </aside>

      <section class="admin-col">
        <h2 id="admin-selected-user">Sélectionne un membre</h2>
        <ul id="admin-conv-list" class="list"></ul>
      </section>

      <section class="admin-col admin-col-wide">
        <h2 id="admin-conv-title">Aucune conversation sélectionnée</h2>
        <div id="admin-messages" class="messages"></div>
      </section>
    </div>
  </div>

  <script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
