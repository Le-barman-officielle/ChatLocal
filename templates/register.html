<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inscription</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1>💬 ChatLocal</h1>
    <h2>Créer un compte</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
      <input type="text" name="username" placeholder="Choisis un pseudo" required autofocus>
      <input type="password" name="password" placeholder="Choisis un mot de passe" required>
      <button type="submit">Créer le compte</button>
    </form>
    <p class="switch">Déjà un compte ? <a href="{{ url_for('login') }}">Connecte-toi</a></p>
  </div>
</body>
</html>
